<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Game - Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .admin-card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        h1 { color: #0984e3; margin-top: 0; font-size: 1.5rem; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; font-size: 0.95rem; }
        th { background-color: #6c5ce7; color: white; }
        tr:hover { background-color: #f8f9fa; }
        
        .cashin-btn { background: #00b894; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .cashin-btn:hover { background: #00a884; }
        
        .input-cash { width: 80px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 0.9rem; margin-right: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h1>ADMIN PANEL - Dice Game Cash In</h1>
        <p style="color: #636e72; font-size: 0.9rem;">EEEEEEEEEE.</p>

        <table>
            <thead>
                <tr>
                    <th>Username / Player</th>
                    <th>Current Balance</th>
                    <th>Aksyon (Cash In)</th>
                </tr>
            </thead>
            <tbody id="playerTableBody">
                <tr>
                    <td colspan="3" style="text-align: center;">LOADING....</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA_oyXSh2lW329AWuyaE8kixGix6nFas",
            authDomain: "colorgame-9e835.firebaseapp.com",
            projectId: "colorgame-9e835",
            storageBucket: "colorgame-9e835.firebasestorage.app",
            messagingSenderId: "246164893744",
            appId: "1:246164893744:web:eb6f326e958a89d13dbdf5",
            measurementId: "G-Q59RJCZPC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const tableBody = document.getElementById("playerTableBody");

        
        onSnapshot(collection(db, "players"), (snapshot) => {
            if (snapshot.empty) {
                tableBody.innerHTML = `<tr><td colspan="3" style="text-align: center;">Walang nahanap na nakarehistrong players.</td></tr>`;
                return;
            }

            let rows = "";
            snapshot.forEach((playerDoc) => {
                const playerData = playerDoc.data();
                const playerId = playerDoc.id;
                const username = playerData.username || "Walang Pangalan";
                const balance = playerData.balance || 0;

                rows += `
                    <tr>
                        <td><strong>${username}</strong></td>
                        <td style="color: #e17055; font-weight: bold;">₱${balance.toLocaleString()}</td>
                        <td>
                            <input type="number" id="amount-${playerId}" class="input-cash" placeholder="₱0" min="1">
                            <button class="cashin-btn" onclick="cashInPlayer('${playerId}', '${username}')">Add</button>
                        </td>
                    </tr>
                `;
            });
            tableBody.innerHTML = rows;
        });

        
        window.cashInPlayer = async function(playerId, username) {
            const inputElement = document.getElementById(`amount-${playerId}`);
            const cashAmount = parseInt(inputElement.value);

            if (!cashAmount || cashAmount <= 0) {
                alert("Mangyaring maglagay ng tamang halaga ng pera para i-cash in!");
                return;
            }

            try {
                const playerRef = doc(db, "players", playerId);
                await updateDoc(playerRef, {
                    balance: increment(cashAmount)
                });

                alert(`Matagumpay na nadagdagan ng ₱${cashAmount} ang balance ni ${username}!`);
                inputElement.value = "";
            } catch (error) {
                console.error("Error sa pag-cash in: ", error);
                alert("Nagkaroon ng problema sa pag-karga. Subukang muli.");
            }
        };
    </script>
</body>
</html>
