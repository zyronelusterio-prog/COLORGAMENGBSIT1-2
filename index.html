<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Game - Login at Sign Up</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background: #0984e3; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #074b83; }
        .toggle-text { text-align: center; margin-top: 15px; font-size: 0.9rem; color: #666; }
        .toggle-text a { color: #0984e3; cursor: pointer; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card" id="authCard">
        <h2 id="formTitle">Mag-Sign Up</h2>
        
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Ilagay ang username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Ilagay ang password">
        </div>

        <button class="btn" id="actionBtn" onclick="handleAuth()">Mag-Sign Up</button>
        
        <div class="toggle-text">
            <span id="toggleMsg">Mayroon nang account?</span>
            <a onclick="toggleMode()">Mag-sign in</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA_oyXSh2lW329AWuyaE8kixGix6nFas",
            authDomain: "colorgame-9e835.firebaseapp.com",
            projectId: "colorgame-9e835",
            storageBucket: "colorgame-9e835.firebasestorage.app",
            messagingSenderId: "246164893744",
            appId: "1:246164893744:web:eb6f326e958a89d13dbdf5",
            measurementId: "G-Q59RJCZPC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let isSignUp = true;

        window.toggleMode = function() {
            isSignUp = !isSignUp;
            document.getElementById("formTitle").innerText = isSignUp ? "Mag-Sign Up" : "Mag-Sign In";
            document.getElementById("actionBtn").innerText = isSignUp ? "Mag-Sign Up" : "Mag-Sign In";
            document.getElementById("toggleMsg").innerText = isSignUp ? "Mayroon nang account?" : "Wala pang account?";
        };

        window.handleAuth = async function() {
            const usernameInput = document.getElementById("username");
            const passwordInput = document.getElementById("password");
            
            const username = usernameInput ? usernameInput.value.trim() : "";
            const password = passwordInput ? passwordInput.value.trim() : "";

            if (!username || !password) {
                alert("Mangyaring punan ang lahat ng espasyo!");
                return;
            }

            if (!isSignUp && username === "admin" && password === "admin123") {
                window.location.href = "admin.html";
                return;
            }

            try {
                if (isSignUp) {
                    const q = query(collection(db, "players"), where("username", "==", username));
                    const querySnapshot = await getDocs(q);

                    if (!querySnapshot.empty) {
                        alert("May gumagamit na ng username na ito! Pumili ng iba.");
                        return;
                    }

                    await addDoc(collection(db, "players"), {
                        username: username,
                        password: password,
                        createdAt: new Date()
                    });

                    alert("Matagumpay ang pag-sign up! Pwede ka nang mag-sign in.");
                    toggleMode();
                } else {
                    const q = query(collection(db, "players"), where("username", "==", username), where("password", "==", password));
                    const querySnapshot = await getDocs(q);

                    if (querySnapshot.empty) {
                        alert("Maling username o password!");
                        return;
                    }

                    alert("Matagumpay na naka-login!");
                    window.location.href = "player.html";
                }

                if(usernameInput) usernameInput.value = "";
                if(passwordInput) passwordInput.value = "";

            } catch (error) {
                console.error("Error sa authentication: ", error);
                alert("Mayroong suliranin sa sistema. Subukan muli.");
            }
        };
    </script>
</body>
</html>
