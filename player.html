<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Game - Dice Lobby</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 480px; margin: 0 auto; }
        h1 { color: #0984e3; margin-top: 0; font-size: 1.5rem; }
        .balance-box { background: #e17055; color: white; padding: 12px; border-radius: 8px; font-size: 1.2rem; font-weight: bold; margin: 15px 0; }
        
        /* 3 Dice Boxes Style */
        .dice-container { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .dice-box { 
            width: 80px; height: 80px; border-radius: 12px; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 1.2rem; font-weight: bold; color: white; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.15); 
            background-color: #2d3436; text-shadow: 1px 1px 2px black;
            transition: transform 0.1s linear;
        }

        /* Color Betting Grid (Box Style) */
        .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .color-card { border-radius: 8px; padding: 10px 5px; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-shadow: 1px 1px 2px black; }
        .color-card label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.9rem; }
        .bet-input-box { width: 80%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 0.9rem; font-weight: bold; box-sizing: border-box; }

        /* Kulay ng mga Box */
        .red { background-color: #d63031; }
        .blue { background-color: #0984e3; }
        .yellow { background-color: #fdcb6e; color: #333 !important; text-shadow: none !important; }
        .green { background-color: #00b894; }
        .pink { background-color: #e84393; }
        .white { background-color: #b2bec3; color: #333 !important; text-shadow: none !important; }

        .btn-roll { width: 100%; padding: 12px; background: #6c5ce7; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-roll:hover { background: #5b4bc4; }
        .btn-roll:disabled { background: #b2bec3; cursor: not-allowed; }
        .logout-btn { display: inline-block; margin-top: 20px; padding: 8px 15px; background: #636e72; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="welcomeUser">BSIT 1-2</h1>
        
        <div class="balance-box">
            BALANCE: <span id="playerBalance">₱0</span>
        </div>

        <!-- 3 Dice Boxes -->
        <div class="dice-container">
            <div class="dice-box" id="dice1">?</div>
            <div class="dice-box" id="dice2">?</div>
            <div class="dice-box" id="dice3">?</div>
        </div>

        <div style="font-weight: bold; color: #555; margin-top: 10px; text-align: left;">ILAGAY ANG TAYA SA MGA KULAY:</div>
        
        <!-- Multi-Bet Color Boxes -->
        <div class="color-grid">
            <div class="color-card red">
                <label>RED</label>
                <input type="number" class="bet-input-box color-bet" data-color="RED" placeholder="₱0" min="0">
            </div>
            <div class="color-card blue">
                <label>BLUE</label>
                <input type="number" class="bet-input-box color-bet" data-color="BLUE" placeholder="₱0" min="0">
            </div>
            <div class="color-card yellow">
                <label>YELLOW</label>
                <input type="number" class="bet-input-box color-bet" data-color="YELLOW" placeholder="₱0" min="0">
            </div>
            <div class="color-card green">
                <label>GREEN</label>
                <input type="number" class="bet-input-box color-bet" data-color="GREEN" placeholder="₱0" min="0">
            </div>
            <div class="color-card pink">
                <label>PINK</label>
                <input type="number" class="bet-input-box color-bet" data-color="PINK" placeholder="₱0" min="0">
            </div>
            <div class="color-card white">
                <label>WHITE</label>
                <input type="number" class="bet-input-box color-bet" data-color="WHITE" placeholder="₱0" min="0">
            </div>
        </div>

        <button class="btn-roll" id="rollBtn" onclick="rollDice()">ROLL DICE</button>

        <div>
            <a href="index.html" class="logout-btn" onclick="logout()">Log Out</a>
        </div>
    </div>

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, increment } from "
