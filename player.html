<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Game - Player Lobby</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; margin: 0 auto; }
        h1 { color: #0984e3; margin-top: 0; }
        .balance-box { background: #e17055; color: white; padding: 15px; border-radius: 8px; font-size: 1.3rem; font-weight: bold; margin: 20px 0; }
        
        /* Display ng 3 Resulta / Dice Roll */
        .dice-container { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .dice { width: 80px; height: 80px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.1rem; text-shadow: 1px 1px 2px black; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        
        .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .color-box { height: 70px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-weight: bold; text-shadow: 1px 1px 2px black; font-size: 1rem; border: 3px solid transparent; }
        .color-box.selected { border-color: #2d3436; transform: scale(1.05); }

        .red { background-color: #d63031; }
        .blue { background-color: #0984e3; }
        .yellow { background-color: #fdcb6e; }
        .green { background-color: #00b894; }
        .pink { background-color: #e84393; }
        .white { background-color: #b2bec3; }

        .btn-roll { width: 100%; padding: 12px; background: #6c5ce7; color: white; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-roll:hover { background: #5b4bc4; }
        .bet-input { width: 80%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin: 10px 0; text-align: center; font-size: 1rem; }
        
        .logout-btn { display: inline-block; margin-top: 25px; padding: 10px 20px; background: #636e72; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="welcomeUser">Maligayang Pagdating!</h1>
        
        <div class="balance-box">
            Kasalukuyang Pondo: <span id="playerBalance">₱0</span>
        </div>

        <!-- Tatlong Kahon ng Lalabas na Resulta -->
        <h3>Lumabas na Resulta</h3>
        <div class="dice-container">
            <div class="dice white" id="dice1">?</div>
            <div class="dice white" id="dice2">?</div>
            <div class="dice white" id="dice3">?</div>
        </div>

        <!-- Pagtaya at Pagpili ng Kulay -->
        <h3>Pumili ng Tayaan at Halaga</h3>
        <input type="number" id="betAmount" class="bet-input" placeholder="Ilagay ang halaga ng taya (hal. 50)" min="1">
        
        <div class="color-grid">
            <div class="color-box red" onclick="selectColor('Pula', this)">PULA</div>
            <div class="color-box blue" onclick="selectColor('Asul', this)">ASUL</div>
            <div class="color-box yellow" onclick="selectColor('Dilaw', this)">DILAW</div>
            <div class="color-box green" onclick="selectColor('Berde', this)">BERDE</div>
            <div class="color-box pink" onclick="selectColor('Rosas', this)">ROSAS</div>
            <div class="color-box white" onclick="selectColor('Puti', this)">PUTI</div>
        </div>

        <button class="btn-roll" onclick="rollColors()">PAIIKUTIN / I-ROLL</button>

        <div>
            <a href="index.html" class="logout-btn" onclick="logout()">Mag-Log Out</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA_oyXSh2lW329AWuyaE8kixGix6nFas",
            authDomain: "colorgame-9e835.firebaseapp.com",
            projectId: "colorgame-9e835",
            storageBucket: "colorgame-9e835.firebasestorage.app",
            messagingSenderId: "246164893744",
            appId: "1:246164893744:web:eb6f326e958a89d13dbdf5",
            measurementId: "G-Q59RJCZPC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loggedId = localStorage.getItem("loggedPlayerId");
        const loggedUser = localStorage.getItem("loggedUsername");

        let currentBalance = 0;
        let selectedColor = "";

        const colorsList = [
            { name: "Pula", class: "red" },
            { name: "Asul", class: "blue" },
            { name: "Dilaw", class: "yellow" },
            { name: "Berde", class: "green" },
            { name: "Rosas", class: "pink" },
            { name: "Puti", class: "white" }
        ];

        if (loggedUser) {
            document.getElementById("welcomeUser").innerText = "Maligayang Pagdating, " + loggedUser + "!";
        }

        if (loggedId) {
            onSnapshot(doc(db, "players", loggedId), (docSnap) => {
                if (docSnap.exists()) {
                    currentBalance = docSnap.data().balance || 0;
                    document.getElementById("playerBalance").innerText = "₱" + currentBalance.toLocaleString();
                }
            });
        }

        window.selectColor = function(colorName, element) {
            selectedColor = colorName;
            document.querySelectorAll('.color-box').forEach(box => box.classList.remove('selected'));
            element.classList.add('selected');
        };

        window.rollColors = async function() {
            const betInput = document.getElementById("betAmount");
            const betAmount = parseInt(betInput.value);

            if (!selectedColor) {
                alert("Pumili muna ng kulay na tatayaan!");
                return;
            }
            if (!betAmount || betAmount <= 0) {
                alert("Maglagay ng tamang halaga ng taya!");
                return;
            }
            if (betAmount > currentBalance) {
                alert("Kulang ang iyong pondo / balance!");
                return;
            }

            // 1. Paikutin ang 3 dice sa pamamagitan ng animation at random selection
            let rolls = [];
            for (let i = 0; i < 3; i++) {
                const randomIndex = Math.floor(Math.random() * colorsList.length);
                rolls.push(colorsList[randomIndex]);
            }

            // Update ng UI display para sa results
            document.getElementById("dice1").className = "dice " + rolls[0].class;
            document.getElementById("dice1").innerText = rolls[0].name;

            document.getElementById("dice2").className = "dice " + rolls[1].class;
            document.getElementById("dice2").innerText = rolls[1].name;

            document.getElementById("dice3").className = "dice " + rolls[2].class;
            document.getElementById("dice3").innerText = rolls[3].name;

            // 2. Bilangin kung ilang beses lumabas ang tinayang kulay
            const matches = rolls.filter(r => r.name === selectedColor).length;

            // 3. I-kwenta ang panalo o talo
            const playerRef = doc(db, "players", loggedId);

            if (matches > 0) {
                const winAmount = betAmount * matches;
                await updateDoc(playerRef, {
                    balance: increment(winAmount)
                });
                alert(`NANALO KA! Lumabas nang ${matches} beses ang ${selectedColor}. Nanalo ka ng ₱${winAmount}!`);
            } else {
                await updateDoc(playerRef, {
                    balance: increment(-betAmount)
                });
                alert(`NATALO KA! Walang lumabas na ${selectedColor}. Nabawasan ka ng ₱${betAmount}.`);
            }
        };

        window.logout = function() {
            localStorage.clear();
        };
    </script>
</body>
</html>
