<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Game - Admin Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h2 { margin: 0; color: #2d3436; }

        .btn-logout {
            background-color: #d63031;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-logout:hover { background-color: #b22222; }

        /* User Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #0984e3;
            color: white;
        }

        .action-group {
            display: flex;
            gap: 8px;
        }

        input[type="number"] {
            width: 100px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-add {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add:hover { background-color: #019875; }

        .btn-deduct {
            background-color: #e17055;
            color: rgb(78, 34, 148);
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-deduct:hover { background-color: #d05030; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>⚙️ Admin Cash-In Dashboard</h2>
            <button class="btn-logout" onclick="logout()">Log Out</button>
        </div>

        <p>PANEL</p>

        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>balance</th>
                    <th> add or minus cash</th>
                    <th>ACTION</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- REGISTERED PALYERS -->
            </tbody>
        </table>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'admin') {
            alert("Aksyon na hindi pinahihintulutan! Mag-sign in muna bilang Admin.");
            window.location.href = 'index.html';
        }

            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';
